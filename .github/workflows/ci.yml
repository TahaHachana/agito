name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features agito/integration,agito-samples/integration,agito-cli/integration -- -D warnings
      - name: Generated CDP bindings are current
        run: cargo xtask codegen --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Browser tests
        run: cargo test -p agito -p agito-samples -p agito-cli --features agito/integration,agito-samples/integration,agito-cli/integration
        env:
          AGITO_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: agito install, then launch the installed build
        # No AGITO_EXECUTABLE_PATH here: the launcher finds the build through the marker.
        run: |
          cargo run -p agito-cli -- install
          cargo test -p agito --features integration --test connect
      - name: Raw transport smoke test
        run: cargo test -p agito --test live_transport -- --ignored
        env:
          AGITO_CHROME: ${{ steps.chrome.outputs.chrome-path }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features agito/integration,agito-samples/integration,agito-cli/integration,agito-mcp/integration -- -D warnings
      - name: Generated CDP bindings are current
        run: cargo xtask codegen --check
      - name: API docs build, with no broken links
        run: |
          cargo doc --no-deps -p agito --features testing
          cargo doc --no-deps -p agito-macros
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      # Through agito run, so the runner is exercised on every push. Doctests are not run
      # here; the test job runs them with cargo test.
      - name: Browser tests, through agito run
        run: >-
          cargo run -q -p agito-cli --
          run
          --reporter junit:target/agito-results/junit.xml
          --reporter html:target/agito-results/report.html
          -p agito -p agito-samples -p agito-cli -p agito-mcp
          --features agito/integration,agito-samples/integration,agito-cli/integration,agito-mcp/integration
        env:
          AGITO_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-reports
          path: target/agito-results/
      - name: agito install, then launch the installed build
        # No AGITO_EXECUTABLE_PATH here: the launcher finds the build through the marker.
        run: |
          cargo run -p agito-cli -- install
          cargo test -p agito --features integration --test connect
      - name: Raw transport smoke test
        run: cargo test -p agito --test live_transport -- --ignored
        env:
          AGITO_CHROME: ${{ steps.chrome.outputs.chrome-path }}

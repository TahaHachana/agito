name: Docs

# Builds the book in `book/` on every push and pull request, and publishes it to GitHub Pages
# from `main`. Its examples are tested by the CI workflow, as `samples/agito-samples/tests/book*.rs`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build book
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: book/book

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

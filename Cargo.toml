[workspace]
resolver = "3"
members = ["crates/*", "samples/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TahaHachana/agito"
rust-version = "1.88"

[workspace.dependencies]
agito-protocol = { path = "crates/agito-protocol", version = "0.2.0" }
agito = { path = "crates/agito", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = "0.30"
futures = "0.3"
bitflags = "2"
tracing = "0.1"
url = "2"

[profile.dev.package."agito-protocol"]
debug = 0

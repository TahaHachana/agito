[package]
name = "agito"
description = "Extensible browser automation and testing for Rust, driving Chromium over the DevTools Protocol directly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["browser", "automation", "testing", "cdp", "chrome"]
categories = ["development-tools::testing", "web-programming", "api-bindings"]

[features]
default = []
# Fake sockets and protocol helpers for testing code built on agito without a browser.
testing = []
# Enables the browser-driving integration tests (needs Chrome/Chromium).
integration = []

[dependencies]
agito-protocol = { workspace = true }
async-trait = "0.1"
bitflags = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
base64 = "0.23"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
regex = "1"
inventory = "0.3"
agito-macros = { path = "../agito-macros", version = "0.3.0" }

[dev-dependencies]
agito = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
async-trait = "0.1"
regex = "1"

[package.metadata.docs.rs]
# The crate docs link to the `testing` module, which only exists with this feature.
features = ["testing"]

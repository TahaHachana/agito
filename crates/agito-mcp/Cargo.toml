[package]
name = "agito-mcp"
description = "A Model Context Protocol server that lets AI agents drive a browser through agito"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://tahahachana.github.io/agito/mcp.html"
keywords = ["mcp", "browser", "automation", "agent", "chrome"]
categories = ["development-tools", "web-programming"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
agito = { workspace = true }
rmcp = { version = "3.12", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
base64 = "0.23"

[features]
# Enables the tests that drive a real Chrome/Chromium.
integration = []

[dev-dependencies]
rmcp = { version = "3.12", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.13", default-features = false }

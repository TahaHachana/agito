[package]
name = "agito-macros"
description = "Procedural macros for agito: #[agito::test] and #[agito::plugin]"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

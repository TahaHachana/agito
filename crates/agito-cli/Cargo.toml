[package]
name = "agito-cli"
description = "The agito command-line tool: install browsers, capture pages, run suites"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["browser", "automation", "testing", "cli", "chrome"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "agito"
path = "src/main.rs"

[features]
# Enables the tests that drive a real Chrome/Chromium.
integration = []

[dependencies]
agito = { workspace = true }
anyhow = "1.0.105"
base64 = "0.23"
clap = { version = "4.6.10", features = ["derive"] }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }
url = { workspace = true }
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
